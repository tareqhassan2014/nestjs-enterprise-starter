name: nestjs-enterprise-starter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_enterprise
    ports:
      # Set POSTGRES_HOST_PORT in .env if 5432 is already taken on your machine.
      # Only the host side changes; the app always reaches postgres:5432 on the
      # Compose network.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # `environment` wins over `env_file`. This service runs the production
      # image, so NODE_ENV must be production regardless of what .env says —
      # otherwise the app would try to load pino-pretty, a devDependency that
      # is deliberately absent from the runtime image.
      NODE_ENV: production
      # Service names on the Compose network, overriding the localhost values
      # in .env that apply when running the app outside Docker.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nestjs_enterprise?schema=public
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
    ports:
      - '${APP_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
